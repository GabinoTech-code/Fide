# gitleaks configuration: default rules plus narrowly scoped allowlists for
# values that are public by design or are test fixtures already in history.
[extend]
useDefault = true

[allowlist]
description = "Public values and historical test fixtures (exact matches only)"
regexTarget = "line"
regexes = [
  # Android signing certificate hashes are public (published in /.well-known/assetlinks.json).
  '''android:apk-key-hash:[A-Za-z0-9_-]{43}''',
  # Fake invitation token in app/apps/site/src/inviteToken.test.ts at 6ff43cc:
  # base64url of "Buongiorno-Fide-invito-token-32b". The test now builds a
  # low-entropy token; this keeps that commit scannable without rewriting history.
  '''Qm9uZ2lvcm5vLUZpZGUtaW52aXRvLXRva2VuLTMyYg''',
]

# Firebase Android client API key is embedded in every installed APK by design.
# Only this public current_key field in this exact config path is allowlisted.
# Service account keys, APNs private keys and all other files stay scanned.
[[rules]]
id = "gcp-api-key"
[[rules.allowlists]]
condition = "AND"
regexTarget = "line"
paths = ['^app/apps/mobile/google-services\.json$']
regexes = ['^\s*"current_key": "AIza[0-9A-Za-z_-]{35}"[,]?\s*$']

[[rules]]
id = "generic-api-key"
[[rules.allowlists]]
condition = "AND"
regexTarget = "line"
paths = ['^app/apps/mobile/google-services\.json$']
regexes = ['^\s*"current_key": "AIza[0-9A-Za-z_-]{35}"[,]?\s*$']
