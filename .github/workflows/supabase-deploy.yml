name: Supabase deploy

# Manual: Edge Function secrets, migrations and Edge Functions for the project
# named by the `SUPABASE_PROJECT_REF` variable of the `production` environment.
#
# The Supabase GitHub integration already applies new migrations when a PR is
# merged into main (its "Supabase Preview" check on main), so `db push` here is
# usually a no-op; it matters when the integration is off. Functions and their
# secrets are only deployed by this workflow.
#
# production environment:
#   secrets  SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD, FIDE_RECEIPT_PRIVATE_KEY,
#            BREVO_API_KEY (optional: e-mail invitations)
#   vars     SUPABASE_PROJECT_REF, FIDE_ALLOWED_ORIGINS, FIDE_SITE_URL,
#            FIDE_MAIL_FROM (optional), FIDE_RECEIPT_PUBLIC_KEY (reference only),
#            FIDE_PORTAL_URL (default https://app.fide-work.it; also the link in notification e-mails)
#   generated on every run: FIDE_DISPATCH_TOKEN (notify-dispatch secret and Vault, for pg_cron)
#   custom SMTP for Auth e-mails (Brevo): vars FIDE_SMTP_HOST, FIDE_SMTP_PORT,
#            FIDE_SMTP_USER, FIDE_MAIL_FROM, FIDE_MAIL_SENDER_NAME; secret FIDE_SMTP_PASS
on:
  workflow_dispatch:

jobs:
  deploy:
    name: secrets, db push & functions deploy
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v7

      - name: Check configuration
        env:
          FIDE_RECEIPT_PRIVATE_KEY: ${{ secrets.FIDE_RECEIPT_PRIVATE_KEY }}
          FIDE_ALLOWED_ORIGINS: ${{ vars.FIDE_ALLOWED_ORIGINS }}
          FIDE_SITE_URL: ${{ vars.FIDE_SITE_URL }}
        run: |
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF FIDE_RECEIPT_PRIVATE_KEY FIDE_ALLOWED_ORIGINS FIDE_SITE_URL; do
            if [ -z "${!v}" ]; then echo "::error::$v is not set on the production environment"; exit 1; fi
          done

      - uses: supabase/setup-cli@v3
        with:
          # Pinned: "latest" asks the GitHub API on every run and fails when its
          # rate limit is hit. Bump deliberately.
          version: 2.120.0

      - run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      # Written to a private temp file, never echoed (GitHub also masks secrets in logs).
      - name: Set Edge Function secrets
        env:
          FIDE_RECEIPT_PRIVATE_KEY: ${{ secrets.FIDE_RECEIPT_PRIVATE_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          FIDE_EXPO_ACCESS_TOKEN: ${{ secrets.FIDE_EXPO_ACCESS_TOKEN }}
          FIDE_ALLOWED_ORIGINS: ${{ vars.FIDE_ALLOWED_ORIGINS }}
          FIDE_SITE_URL: ${{ vars.FIDE_SITE_URL }}
          FIDE_MAIL_FROM: ${{ vars.FIDE_MAIL_FROM }}
          FIDE_PORTAL_URL: ${{ vars.FIDE_PORTAL_URL }}
        run: |
          umask 077
          env_file="$(mktemp)"
          trap 'rm -f "$env_file"' EXIT
          # notify-dispatch token: new on every deploy and also stored in Vault
          # (step "Schedule e-mail notifications") so pg_cron can call the
          # function. Never printed.
          FIDE_DISPATCH_TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$FIDE_DISPATCH_TOKEN"
          echo "FIDE_DISPATCH_TOKEN=$FIDE_DISPATCH_TOKEN" >> "$GITHUB_ENV"
          FIDE_PORTAL_URL="${FIDE_PORTAL_URL:-https://app.fide-work.it}"
          for v in FIDE_RECEIPT_PRIVATE_KEY FIDE_ALLOWED_ORIGINS FIDE_SITE_URL FIDE_MAIL_FROM BREVO_API_KEY FIDE_PORTAL_URL FIDE_DISPATCH_TOKEN FIDE_EXPO_ACCESS_TOKEN; do
            if [ -n "${!v}" ]; then printf '%s=%s\n' "$v" "${!v}" >> "$env_file"; fi
          done
          supabase secrets set --env-file "$env_file"
          supabase secrets list

      # Only these Auth fields are changed. The app and the portal ask for the
      # 6-digit code ({{ .Token }}), but on the free plan Supabase only allows
      # custom templates together with a custom SMTP provider: without one the
      # default e-mail carries a sign-in link (which still works in the portal,
      # because site_url points at it).
      - name: Configure Auth (URLs, SMTP and sign-in e-mails)
        env:
          FIDE_PORTAL_URL: ${{ vars.FIDE_PORTAL_URL }}
          FIDE_PASSKEY_RP_ID: ${{ vars.FIDE_PASSKEY_RP_ID }}
          FIDE_PASSKEY_ORIGINS: ${{ vars.FIDE_PASSKEY_ORIGINS }}
          FIDE_SMTP_HOST: ${{ vars.FIDE_SMTP_HOST }}
          FIDE_SMTP_PORT: ${{ vars.FIDE_SMTP_PORT }}
          FIDE_SMTP_USER: ${{ vars.FIDE_SMTP_USER }}
          FIDE_SMTP_PASS: ${{ secrets.FIDE_SMTP_PASS }}
          FIDE_MAIL_FROM: ${{ vars.FIDE_MAIL_FROM }}
          FIDE_MAIL_SENDER_NAME: ${{ vars.FIDE_MAIL_SENDER_NAME }}
        run: |
          umask 077
          trap 'rm -f "$RUNNER_TEMP/auth.json" "$RUNNER_TEMP/auth-response.json"' EXIT
          portal="${FIDE_PORTAL_URL:-https://app.fide-work.it}"
          # Passkeys: the RP ID is chosen once (changing it invalidates every
          # passkey). fide-work.it covers app.fide-work.it and, through the
          # webcredentials association it serves, the employee app.
          rp_id="${FIDE_PASSKEY_RP_ID:-fide-work.it}"
          # The employee app signs in with passkeys too: iOS sends https://<rp_id>,
          # Android its signing certificate (SHA-256 of the EAS keystore, the one in
          # assetlinks.json, base64url). A new signing key needs a new origin here.
          app_origins="https://fide-work.it,android:apk-key-hash:Pqjxo8_9JaEV2Qi-xfR6jXKY0hIqPs9q8KAwdWqDKXg"
          rp_origins="${FIDE_PASSKEY_ORIGINS:-$portal,$app_origins}"
          base=(--arg site "$portal" --arg allow "$portal/**,fide://**,http://localhost:5173/**"
                --arg rp "$rp_id" --arg origins "$rp_origins")
          passkeys='passkey_enabled: true, webauthn_rp_display_name: "Fide", webauthn_rp_id: $rp, webauthn_rp_origins: $origins'
          if [ -n "$FIDE_SMTP_HOST" ]; then
            for v in FIDE_SMTP_USER FIDE_SMTP_PASS FIDE_MAIL_FROM; do
              if [ -z "${!v}" ]; then echo "::error::$v is required when FIDE_SMTP_HOST is set"; exit 1; fi
            done
            jq -n "${base[@]}" \
              --arg host "$FIDE_SMTP_HOST" --arg port "${FIDE_SMTP_PORT:-587}" --arg user "$FIDE_SMTP_USER" \
              --arg pass "$FIDE_SMTP_PASS" --arg from "$FIDE_MAIL_FROM" --arg name "${FIDE_MAIL_SENDER_NAME:-Fide}" \
              --rawfile tpl supabase/templates/otp-code.html \
              "{site_url: \$site, uri_allow_list: \$allow, mailer_otp_length: 6, mailer_otp_exp: 600, $passkeys,"'
                smtp_host: $host, smtp_port: $port, smtp_user: $user, smtp_pass: $pass,
                smtp_admin_email: $from, smtp_sender_name: $name,
                mailer_subjects_magic_link: "Il tuo codice di accesso a Fide", mailer_templates_magic_link_content: $tpl,
                mailer_subjects_confirmation: "Il tuo codice di accesso a Fide", mailer_templates_confirmation_content: $tpl}' > "$RUNNER_TEMP/auth.json"
          else
            echo "::notice::No custom SMTP (vars.FIDE_SMTP_HOST): sign-in e-mails keep Supabase's default link template."
            jq -n "${base[@]}" "{site_url: \$site, uri_allow_list: \$allow, mailer_otp_length: 6, mailer_otp_exp: 600, $passkeys}" > "$RUNNER_TEMP/auth.json"
          fi
          code=$(curl -sS -o "$RUNNER_TEMP/auth-response.json" -w '%{http_code}' -X PATCH \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            --data "@$RUNNER_TEMP/auth.json")
          if [ "$code" != "200" ]; then
            echo "::error::Auth config update failed (HTTP $code): $(jq -c '{message, error, msg}' "$RUNNER_TEMP/auth-response.json" 2>/dev/null || head -c 300 "$RUNNER_TEMP/auth-response.json")"
            exit 1
          fi
          jq '{site_url, uri_allow_list, mailer_otp_length, mailer_otp_exp, smtp_host, smtp_sender_name, mailer_subjects_magic_link}' "$RUNNER_TEMP/auth-response.json"

      - run: supabase db push

      - name: Deploy Edge Functions
        run: supabase functions deploy

      # E-mail notifications: pg_cron calls notify-dispatch with the URL and the
      # token kept in Vault (private.set_notify_config, migration
      # 20261009120000_notifications.sql); same token as the function secret.
      - name: Schedule e-mail notifications
        run: |
          umask 077
          trap 'rm -f "$RUNNER_TEMP/notify.json" "$RUNNER_TEMP/notify-response.json"' EXIT
          url="https://$SUPABASE_PROJECT_REF.supabase.co/functions/v1/notify-dispatch"
          # Both values go inside SQL literals: allow only safe characters.
          [[ "$FIDE_DISPATCH_TOKEN" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::bad dispatch token"; exit 1; }
          [[ "$url" =~ ^https://[a-z0-9.-]+/functions/v1/notify-dispatch$ ]] || { echo "::error::bad URL"; exit 1; }
          jq -n --arg q "select private.set_notify_config('$url', '$FIDE_DISPATCH_TOKEN')" '{query: $q}' > "$RUNNER_TEMP/notify.json"
          code=$(curl -sS -o "$RUNNER_TEMP/notify-response.json" -w '%{http_code}' -X POST \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            --data "@$RUNNER_TEMP/notify.json")
          if [ "$code" != "200" ] && [ "$code" != "201" ]; then
            echo "::error::Scheduling notifications failed (HTTP $code): $(head -c 300 "$RUNNER_TEMP/notify-response.json")"
            exit 1
          fi
          echo "notify-dispatch scheduled; token rotated."
