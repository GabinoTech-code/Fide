name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  js:
    name: Typecheck, lint & unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build --workspace apps/web-portal
      - run: npm run build --workspace apps/site

  mobile-export:
    name: Expo export (iOS and Android bundles)
    runs-on: ubuntu-latest
    needs: js
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
        working-directory: app

      # The employee app ships on iOS/Android only (the portal is the web app).
      - run: npx expo export --platform ios --platform android --no-bytecode --output-dir dist
        working-directory: app/apps/mobile

  # RLS/grant/RPC behaviour is tested in the `js` job (app/packages/db-tests, PGlite).
  # This job checks the same migrations against the real Supabase images.
  db:
    name: Supabase migrations on the real stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v3
        with:
          # Pinned: "latest" asks the GitHub API on every run and fails when its
          # rate limit is hit. Bump deliberately.
          version: 2.120.0

      - name: Start Postgres, Auth and Storage (applies migrations + seed)
        run: supabase start -x studio,imgproxy,inbucket,edge-runtime,logflare,vector,supavisor

      - name: Lint schema
        run: supabase db lint --local --level error --fail-on error

      - name: Generate TypeScript types
        run: supabase gen types typescript --local > database.types.ts

      # Becomes a drift check (git diff --exit-code) once the file is committed
      # to app/packages/shared/src/database.types.ts.
      - uses: actions/upload-artifact@v4
        with:
          name: database-types
          path: database.types.ts

  functions:
    name: Edge Functions (deno check + lint, shared code in sync)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
      - run: npm run sync-shared -- --check
      # Run Deno from supabase/functions so it resolves jsr:/npm: imports itself
      # instead of the monorepo's node_modules (as the Edge runtime does).
      - run: ../../app/node_modules/.bin/deno lint
        working-directory: supabase/functions
      - run: ../../app/node_modules/.bin/deno check --no-lock */index.ts
        working-directory: supabase/functions

