name: Fide CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  typecheck-and-build:
    name: Verify TypeScript & Metro Bundler
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install Dependencies
        working-directory: app
        run: npm ci

      - name: Run Typecheck Across All Workspaces
        working-directory: app
        run: npm run typecheck

      - name: Validate Expo Export (iOS, Android, Web)
        working-directory: app/apps/mobile
        run: npx expo export --no-bytecode --output-dir dist
