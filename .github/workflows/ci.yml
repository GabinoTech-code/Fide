name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  js:
    name: Typecheck, lint & unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  mobile-export:
    name: Expo export (iOS, Android, web bundles)
    runs-on: ubuntu-latest
    needs: js
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
        working-directory: app

      - run: npx expo export --no-bytecode --output-dir dist
        working-directory: app/apps/mobile

  # Phase 1 adds a `db` job (supabase start → db reset → supabase test db → gen types drift check),
  # Phase 2 a `functions` job (deno check/test) and Phase 3 the portal `vite build`.
