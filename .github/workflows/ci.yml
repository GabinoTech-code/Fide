name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  js:
    name: Typecheck, lint & unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  mobile-export:
    name: Expo export (iOS, Android, web bundles)
    runs-on: ubuntu-latest
    needs: js
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
        working-directory: app

      - run: npx expo export --no-bytecode --output-dir dist
        working-directory: app/apps/mobile

  # RLS/grant/RPC behaviour is tested in the `js` job (app/packages/db-tests, PGlite).
  # This job checks the same migrations against the real Supabase images.
  db:
    name: Supabase migrations on the real stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Postgres, Auth and Storage (applies migrations + seed)
        run: supabase start -x studio,imgproxy,inbucket,edge-runtime,logflare,vector,supavisor

      - name: Lint schema
        run: supabase db lint --local --level error --fail-on error

      - name: Generate TypeScript types
        run: supabase gen types typescript --local > database.types.ts

      # Becomes a drift check (git diff --exit-code) once the file is committed
      # to app/packages/shared/src/database.types.ts.
      - uses: actions/upload-artifact@v4
        with:
          name: database-types
          path: database.types.ts

  functions:
    name: Edge Functions (deno check + lint, shared code in sync)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
      - run: npm run sync-shared -- --check
      - run: npx deno lint ../supabase/functions
      - run: npx deno check ../supabase/functions/*/index.ts

  # Phase 3 adds the portal `vite build`.
