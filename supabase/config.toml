# Fide — Supabase local development stack (`supabase start`).
# The hosted pilot project (EU) is configured in the dashboard; keep the auth
# settings there in sync with this file. See docs/adr/0001 and 0003.
project_id = "fide"

[api]
enabled = true
port = 54321
# Only public is exposed through PostgREST; `private` holds RLS helpers and secrets.
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true
ip_version = "IPv4"

[studio]
enabled = true
port = 54323

# Local e-mail catcher: OTP codes and invitation e-mails land here.
[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

# Also created by migration 20261007090300 (config buckets only apply locally).
[storage.buckets.encrypted-documents]
public = false
file_size_limit = "25MiB"
allowed_mime_types = ["application/octet-stream"]

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/**", "fide://**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Employees get their account through e-mail OTP right before redeeming an
# invitation; who belongs to which company is decided by the invitation RPCs.
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
otp_length = 6
otp_expiry = 600
max_frequency = "60s"

# Passkeys (Supabase Auth, beta). Registration needs an existing session, so the
# first sign-in is always OTP. Changing rp_id invalidates every passkey.
# Pilot: rp_id = the production domain, rp_origins = portal origin(s) plus
# "android:apk-key-hash:<base64url sha256 of the signing cert>".
[auth.passkey]
enabled = true

[auth.webauthn]
rp_display_name = "Fide"
rp_id = "localhost"
rp_origins = ["http://localhost:5173"]

[auth.mfa]
max_enrolled_factors = 10

[edge_runtime]
enabled = true
policy = "per_worker"
