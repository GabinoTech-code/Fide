# Fide public site (fide-work.it) and HR portal (app.fide-work.it): static files
# behind Caddy, which also obtains and renews the TLS certificates.
#
# Built to share a host with other services (e.g. a TURN server) without
# touching them: read-only container, no capabilities beyond binding 80/443,
# read-only web roots, CPU and memory caps. See ../README.md.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      # Change these if 80/443 are taken on the host (see README: TURN over TLS).
      - "${FIDE_HTTP_PORT:-80}:80"
      - "${FIDE_HTTPS_PORT:-443}:443"
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env (Let's Encrypt account e-mail)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./www/site:/srv/site:ro
      - ./www/portal:/srv/portal:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 100
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  caddy_data: {}
  caddy_config: {}
